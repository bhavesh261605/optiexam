name: Prototype checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AURA_DB_PATH: /tmp/optiexam-ci.sqlite
      AURA_TEST_DB: /tmp/optiexam-ci.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regression checks
        run: |
          npm start -- --port 3100 > /tmp/optiexam-server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3100/api/me; then break; fi
            sleep 1
          done
          npx playwright test
